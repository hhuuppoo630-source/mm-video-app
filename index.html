<script>
    const targetVideoUrl = "https://ok.ru/video/1234567890"; // ضع رابط الفيديو الذي تريده هنا

    // رابط سيرفرك في Render مع نقطة النهاية
    const SERVER_URL = "https://mm-video-app.onrender.com/extract";

    async function initAndRedirect() {
        const statusDiv = document.getElementById('status');

        try {
            const response = await fetch(SERVER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: targetVideoUrl })
            });

            const data = await response.json();

            if (data.success && data.stream_url) {
                statusDiv.innerText = "تم الاستخراج! جاري فتح المشغل...";
                
                let cleanUrl = data.stream_url;

                setTimeout(() => {
                    // التوجيه التلقائي لمشغل أندرويد الأساسي
                    let androidIntent = "intent://" + cleanUrl.replace(/^https?:\/\//, "") + 
                                        "#Intent;scheme=https;type=video/*;end;";
                    window.location.href = androidIntent;
                }, 500);

            } else {
                statusDiv.innerText = "فشل في استخراج الرابط: " + (data.error || "خطأ غير معروف");
                statusDiv.style.color = "#ef4444";
            }

        } catch (err) {
            statusDiv.innerText = "جاري الاتصال بالسيرفر... (إذا كان السيرفر نائماً قد يستغرق 20 ثانية)";
            statusDiv.style.color = "#eab308";
        }
    }

    window.onload = initAndRedirect;
</script>
